</style></head><body><div id="app"></div><button class="feedbackfloat" id="feedback-button" onclick="openFeedback()">☷ &nbsp; Beri feedback</button><dialog id="modal"></dialog><dialog id="inspection-modal" class="inspection-modal" aria-labelledby="inspection-modal-title"></dialog><dialog id="review-document-modal" class="review-modal document-modal" aria-labelledby="review-document-modal-title"></dialog><dialog id="review-documentation-modal" class="review-modal document-modal documentation-modal" aria-labelledby="review-documentation-modal-title"></dialog><div id="live" role="status" aria-live="polite"></div>
<script>
'use strict';

// Local demo data. Each examination group owns its table and document metadata.
const inspectionDefinitions = [
  {description:'Identitas badan usaha, perizinan, dan lokasi fasilitas.', columns:['Informasi','Data perusahaan','Dokumen pendukung'], rows:[['Nama perusahaan','{company}','Profil perusahaan.pdf'],['NIB','SIM-NIB-2026-001','NIB simulasi.pdf'],['Lokasi fasilitas','{location}','Profil fasilitas.pdf']]},
  {description:'Dokumen persyaratan dan referensi perusahaan MRO.', columns:['Dokumen','Referensi simulasi','Ketersediaan'], rows:[['Perizinan usaha','SIM-IZIN-2026-001','Contoh tersedia'],['Sertifikat kompetensi','SIM-SERT-2026-002','Contoh tersedia'],['Surat Penetapan','SIM-SP-2026-003','Perlu dikonfirmasi']]},
  {description:'Daftar barang, part number, jumlah, dan bukti kebutuhan impor.', columns:['Referensi HS simulasi','Nama barang','Part number','Jumlah rencana','Satuan','Dokumen pendukung'], rows:[['SIM-HS-001','Hydraulic pump','HP-204','40','unit','Lembar spesifikasi HP-204 · v2'],['SIM-HS-002','Seal kit','SK-017','100','set','Rencana kebutuhan impor · v1'],['SIM-HS-003','Bearing assembly','BA-320','25','unit','Katalog komponen BA-320 · v1']]},
  {description:'Lingkup kegiatan MRO, periode, dan fasilitas pelaksana.', columns:['Kegiatan MRO','Objek pemeriksaan','Periode rencana','Fasilitas'], rows:[['Pemeliharaan komponen','Hydraulic pump','Nov–Des 2026','{location}'],['Perbaikan komponen','Bearing assembly','Nov–Des 2026','Workshop komponen']]},
  {description:'Fasilitas, satuan kapasitas, dan bukti pendukung kegiatan.', columns:['Fasilitas','Kapasitas simulasi','Satuan kapasitas','Dokumen pendukung'], rows:[['Hanggar utama','2','pesawat per periode layanan','Profil fasilitas.pdf'],['Workshop komponen','60','komponen per bulan','Daftar peralatan.pdf']]},
  {description:'Lingkup pekerjaan dan dokumen subkontrak jika digunakan.', columns:['Mitra subkontrak','Lingkup pekerjaan','Referensi dokumen','Catatan'], rows:[]},
  {description:'Catatan kunjungan, kondisi fasilitas, dan bukti lapangan.', columns:['Objek pemeriksaan','Kondisi / hasil observasi','Dokumen pendukung','Catatan'], rows:[]}
];
let inspectionContext = null;

function inspectionRows(p,index){
  const saved=db.inspectionRows?.[p.id+'|'+index];
  return saved || inspectionDefinitions[index].rows.map(row=>row.map(value=>value.replace('{company}',p.name).replace('{location}',p.location)));
}
function inspectionState(p,index){
  const value=db.checks[p.id+'|'+groups[index]]?.value;
  if(value) return {label:value,tone:value==='Sesuai'||value==='Tidak relevan'?'green':value==='Perlu klarifikasi'||value==='Tidak sesuai'?'amber':'cyan',done:value==='Sesuai'||value==='Tidak relevan'};
  if(p.fresh) return {label:'Belum dinilai',tone:'cyan',done:false};
  return index<2?{label:'Selesai diperiksa',tone:'green',done:true}:index===2?{label:'Perlu klarifikasi',tone:'amber',done:false}:{label:'Belum dinilai',tone:'cyan',done:false};
}
function inspectionTimeline(p){
  const completed=groups.filter((_,i)=>inspectionState(p,i).done).length;
  return `<section class="panel inspection-timeline-panel" aria-labelledby="inspection-timeline-title"><div class="inspection-timeline-head"><div><h3 id="inspection-timeline-title">Kelompok pemeriksaan</h3><p class="muted small">Buka setiap kelompok untuk meninjau data dan dokumen pendukung.</p></div><span class="badge gray">${completed} dari ${groups.length} kelompok ditinjau</span></div><ol class="inspection-timeline">${groups.map((name,index)=>{
    const state=inspectionState(p,index),rows=inspectionRows(p,index),files=(db.attachments||[]).filter(a=>a.project===p.id&&a.group===index);
    return `<li class="inspection-timeline-item ${state.tone}"><div class="inspection-timeline-top"><h4>${esc(name)}</h4><div class="inspection-timeline-actions">${badge(state.label,state.tone==='cyan'?'gray':state.tone)}<button type="button" class="inspection-open" aria-label="Buka ${esc(name)}" onclick="openInspectionGroup('${p.id}',${index})">Buka ${inspectionIcon('open')}</button></div></div><p>${inspectionDefinitions[index].description}</p><div class="inspection-timeline-meta"><button type="button" class="inspection-file-chip" onclick="openInspectionGroup('${p.id}',${index})">${inspectionIcon('file')}${rows.length?rows.length+' '+(index===1?'dokumen':'data pemeriksaan'):'Belum ada data'}</button>${files.length?`<span class="small muted">${files.length} lampiran lokal</span>`:''}<span class="inspection-step-label">Kelompok ${index+1}</span></div></li>`;
  }).join('')}</ol></section>`;
}
function inspectionIcon(name){const paths={open:'<path d="M14 3h7v7M21 3l-11 11M10 3H3v18h18v-7"/>',file:'<path d="M5 3h10l4 4v14H5ZM14 3v5h5M8 12h8M8 16h6"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',upload:'<path d="M12 16V4m-5 5 5-5 5 5M4 16v5h16v-5"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',plus:'<path d="M12 4v16M4 12h16"/>',close:'<path d="m5 5 14 14M19 5 5 19"/>'};return `<svg class="inspection-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${paths[name]}</svg>`}
function openInspectionGroup(id,index){
  inspectionContext={id,index,query:'',page:1,size:10};
  refreshInspectionGroup();
  document.getElementById('inspection-modal').showModal();
}
function closeInspectionGroup(){document.getElementById('inspection-modal').close();inspectionContext=null}
function refreshInspectionGroup(){
  if(!inspectionContext)return;
  const p=db.projects.find(p=>p.id===inspectionContext.id),index=inspectionContext.index;
  document.getElementById('inspection-modal').innerHTML=`<header class="inspection-modal-head"><div><h2 id="inspection-modal-title">${esc(groups[index])}</h2><p>${esc(p.name)} <span>·</span> ${esc(p.id)} <span>·</span> W1</p></div><button type="button" class="inspection-close" aria-label="Tutup kelompok pemeriksaan" onclick="closeInspectionGroup()">${inspectionIcon('close')}</button></header><div class="inspection-modal-body"><p class="inspection-description">${inspectionDefinitions[index].description}</p><div class="inspection-toolbar"><label class="inspection-search">${inspectionIcon('search')}<input type="search" aria-label="Cari data pemeriksaan" placeholder="Cari" value="${esc(inspectionContext.query)}" oninput="filterInspectionTable(this.value)"></label><button type="button" onclick="exportInspectionTable(true)">${inspectionIcon('download')}Unduh Template</button><button type="button" onclick="exportInspectionTable(false)">${inspectionIcon('file')}Ekspor Excel</button><button type="button" class="inspection-upload" onclick="importInspectionExcel()">${inspectionIcon('upload')}Unggah Excel</button></div><div id="inspection-table-area">${inspectionTable()}</div><div class="inspection-support"><div class="inspection-support-head"><div><h3>Dokumen pendukung</h3><p>Hubungkan lampiran dengan kelompok pemeriksaan ini.</p></div><button type="button" onclick="attachInspectionDocument()">${inspectionIcon('plus')}Lampirkan Dokumen</button></div><div class="inspection-attachment-list">${inspectionAttachments()}</div></div><div class="inspection-modal-bottom"><div>${assessment(p,groups[index])}</div><div class="inspection-disclaimer">Prototype · Unggah mencatat nama berkas untuk simulasi alur impor. Isi Excel belum diproses.</div></div></div><footer class="inspection-modal-footer"><button type="button" class="textbutton" onclick="closeInspectionGroup()">Kembali</button><button type="button" onclick="newFinding('${p.id}','${groups[index]}')">Catat temuan</button></footer>`;
}
function inspectionTable(){
  const {id,index,query,size}=inspectionContext,p=db.projects.find(p=>p.id===id),definition=inspectionDefinitions[index];
  const filtered=inspectionRows(p,index).map((row,i)=>({row,i})).filter(({row})=>row.some(v=>String(v).toLowerCase().includes(query.toLowerCase())));
  const pages=Math.max(1,Math.ceil(filtered.length/size));inspectionContext.page=Math.min(inspectionContext.page,pages);
  const page=inspectionContext.page,start=(page-1)*size,visible=filtered.slice(start,start+size);
  const headers=index===2?`<tr><th rowspan="2" class="inspection-number">No</th><th rowspan="2">Referensi HS simulasi</th><th colspan="2">Identitas barang sesuai rencana</th><th colspan="2">Kebutuhan impor</th><th rowspan="2">Dokumen pendukung</th><th rowspan="2">Tindakan</th></tr><tr><th>Nama barang</th><th>Part number</th><th>Jumlah rencana</th><th>Satuan</th></tr>`:`<tr><th class="inspection-number">No</th>${definition.columns.map(c=>`<th>${esc(c)}</th>`).join('')}<th>Tindakan</th></tr>`;
  return `<div class="inspection-table-scroll"><table class="inspection-data-table ${index===2?'inspection-import-table':''}"><thead>${headers}</thead><tbody>${visible.map(({row,i},n)=>`<tr><td>${start+n+1}</td>${row.map(v=>`<td>${esc(v)}</td>`).join('')}<td><button type="button" class="textbutton" onclick="previewInspectionRow(${i})">Periksa</button></td></tr>`).join('')||`<tr><td colspan="${definition.columns.length+2}" class="empty">${query?'Tidak ada data yang cocok. Ubah pencarian.':'Belum ada data. Tambahkan data atau coba simulasi unggah Excel.'}</td></tr>`}</tbody><tfoot><tr><td colspan="${definition.columns.length+2}">${index===2?'Jumlah dipisahkan menurut satuan: '+inspectionQuantitySummary(filtered.map(v=>v.row)):'Total '+filtered.length+' data pemeriksaan'}</td></tr></tfoot></table></div><div class="inspection-pagination"><button type="button" class="inspection-add" onclick="addInspectionRow()" aria-label="Tambah data pemeriksaan">${inspectionIcon('plus')}</button><span>Menampilkan ${filtered.length?start+1:0}–${Math.min(start+size,filtered.length)} dari ${filtered.length} data</span><label><span class="sr-only">Jumlah data per halaman</span><select aria-label="Jumlah data per halaman" onchange="inspectionContext.size=Number(this.value);inspectionContext.page=1;refreshInspectionTable()">${[5,10,25].map(n=>`<option value="${n}" ${size===n?'selected':''}>${n}/halaman</option>`).join('')}</select></label><div class="inspection-page-buttons"><button type="button" aria-label="Halaman sebelumnya" ${page===1?'disabled':''} onclick="inspectionContext.page--;refreshInspectionTable()">‹</button><span>${page}</span><button type="button" aria-label="Halaman berikutnya" ${page===pages?'disabled':''} onclick="inspectionContext.page++;refreshInspectionTable()">›</button></div></div>`;
}

// Genuine, dependency-free XLSX export (uncompressed ZIP / Office Open XML).
function inspectionWorkbook(columns,rows){
  const xml=v=>String(v).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));
  const columnName=index=>{let result='';for(index++;index;index=Math.floor((index-1)/26))result=String.fromCharCode(65+(index-1)%26)+result;return result};
  const sheet=[columns,...rows].map((row,r)=>`<row r="${r+1}">${row.map((v,c)=>`<c r="${columnName(c)}${r+1}" t="inlineStr"><is><t xml:space="preserve">${xml(v)}</t></is></c>`).join('')}</row>`).join('');
  const files={
    '[Content_Types].xml':'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>',
    '_rels/.rels':'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
    'xl/workbook.xml':'<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Pemeriksaan MRO" sheetId="1" r:id="rId1"/></sheets></workbook>',
    'xl/_rels/workbook.xml.rels':'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>',
    'xl/worksheets/sheet1.xml':`<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${sheet}</sheetData></worksheet>`
  };
  const encoder=new TextEncoder(),chunks=[],directory=[];let offset=0;
  const crc=bytes=>{let n=0xffffffff;for(const b of bytes){n^=b;for(let bit=0;bit<8;bit++)n=n&1?(n>>>1)^0xedb88320:n>>>1}return (n^0xffffffff)>>>0};
  const header=(length,fields)=>{let a=new Uint8Array(length),v=new DataView(a.buffer);for(const [at,bytes,value]of fields)bytes===4?v.setUint32(at,value,true):v.setUint16(at,value,true);return a};
  for(const [name,content]of Object.entries(files)){const filename=encoder.encode(name),data=encoder.encode(content),checksum=crc(data);const local=header(30,[[0,4,0x04034b50],[4,2,20],[6,2,0x800],[12,2,33],[14,4,checksum],[18,4,data.length],[22,4,data.length],[26,2,filename.length]]);chunks.push(local,filename,data);directory.push(header(46,[[0,4,0x02014b50],[4,2,20],[6,2,20],[8,2,0x800],[14,2,33],[16,4,checksum],[20,4,data.length],[24,4,data.length],[28,2,filename.length],[42,4,offset]]),filename);offset+=30+filename.length+data.length}
  const directorySize=directory.reduce((sum,a)=>sum+a.length,0);return new Blob([...chunks,...directory,header(22,[[0,4,0x06054b50],[8,2,5],[10,2,5],[12,4,directorySize],[16,4,offset]])],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

<script>
'use strict';
// Progress is explicit and belongs to one project. Importing data never approves it.
globalThis.MROReviewState = (() => {
  function first(state) { const i=state.done.findIndex(v=>!v); return i<0?state.done.length:i; }
  function canOpen(state,i) { return Number.isInteger(i)&&i>=0&&i<state.done.length&&i<=first(state); }
  function canEdit(state,i) { return canOpen(state,i)&&!state.done[i]&&i===first(state); }
  function load(db,id,defs) {
    db.projectReviews ||= {};
    let state=db.projectReviews[id];
    if(!state||!Array.isArray(state.done)||state.done.length!==defs.length) {
      state={done:defs.map(()=>false),rows:defs.map(s=>structuredClone(s.rows)),source:defs.map(()=> 'Data contoh untuk review client')};
      db.projectReviews[id]=state;
    }
    let gap=false;
    state.done=state.done.map(v=>{if(v!==true)gap=true;return !gap;});
    if(!Array.isArray(state.rows))state.rows=[];
    if(!Array.isArray(state.source))state.source=[];
    defs.forEach((def,i)=>{
      if(!Array.isArray(state.rows[i])||!state.rows[i].every(r=>Array.isArray(r)&&r.length===def.columns.length))state.rows[i]=structuredClone(def.rows);
      if(typeof state.source[i]!=='string')state.source[i]='Data contoh untuk review client';
    });
    return state;
  }
  function finish(state,i) { if(!canEdit(state,i))return false;state.done[i]=true;return true; }
  function reopen(state,i) { if(!canOpen(state,i)||!state.done[i])return false;state.done.fill(false,i);return true; }
  function applyImport(state,i,rows,name,mode) {
    if(!canEdit(state,i))return false;
    state.rows[i]=mode==='replace'?structuredClone(rows):[...state.rows[i],...structuredClone(rows)];
    state.source[i]=name+' · simulasi';return true;
  }
  return {load,first,canOpen,canEdit,finish,reopen,applyImport};
})();

</script>

function progress(p){const s=db.projectReviews?.[p.id];return Array.isArray(s?.done)&&s.done.length?Math.round(s.done.filter(Boolean).length/s.done.length*100):0}
function mount(p,requested='summary'){
  currentProject=p;stepDefinitions=definitionsFor(p);state=MROReviewState.load(db,p.id,stepDefinitions);
  state.documents=normalizeDocuments(state.documents);
  if(!sessions.has(p.id))sessions.set(p.id,{step:Math.min(firstIncomplete(),stepDefinitions.length-1),query:'',notice:'',reopen:false,save:'Tersimpan pada browser ini',importStep:0,importName:'',mode:'append',importError:'',importApplied:false});
  ui=sessions.get(p.id);const tab=({inspection:'verification',evidence:'documents'})[requested]||requested;ui.tab=['summary','verification','documents','documentation'].includes(tab)?tab:'summary';
  if(!canOpen(ui.step))ui.step=Math.min(firstIncomplete(),stepDefinitions.length-1);
  documentationItems=p.fresh?[]:galleryExamples.map(item=>({...item,location:p.location}));
  const tabs=[['summary','Ringkasan'],['verification','Verifikasi'],['documents','Dokumen Penunjang'],['documentation','Dokumentasi']];
  const title=globalThis.head(esc(p.name),p.w+' · '+types[p.w]+' · '+p.id,btn('Riwayat',`showHistory('${p.id}')`));
  const content=ui.tab==='summary'?summaryView():ui.tab==='documents'?documentsView():ui.tab==='documentation'?documentationView():verificationView();
  return `<div class="project-review"><div class="overline"><a href="#list/${p.w}">Project / ${esc(types[p.w])}</a> / ${esc(p.id)}</div>${title}<div class="statusrow"><div class="statusbox"><small>Status Project</small>${badge(p.status)}</div><div class="statusbox"><small>Dokumen hasil</small>${badge(p.result,'gray')}</div><div class="statusbox"><small>Status resmi</small>${badge(p.official,'gray')}</div></div>${p.fresh?'<p class="note">Project baru. Data verifikasi yang ditampilkan adalah contoh untuk mencoba alur.</p>':''}<nav class="tabs project-tabs" aria-label="Tab Detail Project">${tabs.map(([id,label])=>`<a data-tab="${id}" href="#project/${p.id}/${id}" ${id===ui.tab?'aria-current="page"':''} class="${id===ui.tab?'active':''}">${label}</a>`).join('')}</nav><div id="project-content">${bind(content)}</div></div>`;
}
function verificationView(){return `<div class="verification-head"><div><h2>Verifikasi</h2><p>Tinjau data tabel dan selesaikan setiap step secara berurutan.</p></div><span class="verification-count">${state.done.filter(Boolean).length}/${stepDefinitions.length} step selesai</span></div>${firstIncomplete()===stepDefinitions.length?'<div class="completion-panel"><h3>Seluruh step verifikasi selesai</h3><p>Data siap ditinjau untuk penyusunan hasil. Status resmi belum berubah.</p><button onclick="setTab(\'summary\')">Lihat ringkasan</button></div>':''}<div class="step-layout">${stepRail()}<section class="step-main">${mobilePicker()}${stepContent()}</section></div>`}
function afterRender(){if(document.getElementById('project-content'))renderTable()}
function bind(html){return html.replace(/\bon(click|input|change)="([^"]*)"/g,(_,event,code)=>`on${event}="${code.replace(/\b(ui|state)\b/g,'RV.$1').replace(/(?<![\w.])([A-Za-z_$][\w$]*)\s*\(/g,(match,name)=>apiNames.has(name)?'RV.'+match:match)}"`)}


const documentCategories=[
  {name:'Dokumen Legalitas',description:'Identitas, perizinan, dan dokumen badan usaha.'},
  {name:'Dokumen Teknis MRO',description:'Dokumen terkait layanan dan fasilitas MRO.'}
];
function initialDocuments(){
  const examples=[['nib','NIB'],['npwp','NPWP'],['license','Perizinan Usaha'],['deed','Akta Pendirian'],['deed-approval','SK Pengesahan Akta Pendirian'],['deed-change','Akta Perubahan (jika ada)'],['change-approval','SK Pengesahan Akta Perubahan (jika ada)'],['profile','Profil Perusahaan']];
  const legal=examples.map(([id,title],index)=>({id,title,category:'Dokumen Legalitas',number:'SIM-LEGAL-'+String(index+1).padStart(3,'0'),date:'2026-11-20',file:title.replace(/[^a-zA-Z0-9]+/g,'-')+'.pdf',version:1,source:'example',note:'Representasi '+title+' untuk '+currentProject.name+'.'}));
  const technical=[['technical-certificate','Sertifikat Layanan MRO'],['facilities','Daftar Fasilitas & Peralatan'],['capacity','Informasi Kapasitas Layanan']].map(([id,title],index)=>({id,title,category:'Dokumen Teknis MRO',number:'SIM-TEKNIS-'+String(index+1).padStart(3,'0'),date:'2026-11-20',file:title.replace(/[^a-zA-Z0-9]+/g,'-')+'.pdf',version:1,source:'example',note:'Contoh dokumen terkait fasilitas dan layanan MRO untuk diskusi rancangan.'}));
  const records=[...legal,...technical,{id:'st',title:'Surat Tugas',category:'Dokumen Kegiatan',number:'SIM-ST-2026-001',date:'2026-11-23',file:'Surat-Tugas-MRO-001.pdf',version:1,source:'example',note:'Penugasan '+currentProject.owner+' untuk kegiatan verifikasi di '+currentProject.location+'.'},{id:'ba',title:'Berita Acara',category:'Dokumen Kegiatan',number:'',date:'',file:'',version:0,source:'',note:''}];if(currentProject.fresh){for(const doc of records){doc.file='';doc.source='';doc.version=0;doc.number='';doc.date=''}}return records;
}
function validDocumentRecord(doc){return doc&&['id','title','category','number','date','file','note'].every(k=>typeof doc[k]==='string')&&/^[a-z0-9-]+$/.test(doc.id)&&Number.isInteger(doc.version)&&doc.version>=0&&['','example','metadata'].includes(doc.source)}
function normalizeDocuments(records){const result=initialDocuments();if(!Array.isArray(records))return result;for(const doc of records){if(!validDocumentRecord(doc))continue;const index=result.findIndex(d=>d.id===doc.id);if(index>=0)result[index]={...doc,category:result[index].category};else if(documentCategories.some(c=>c.name===doc.category))result.push({...doc})}return result}
function docUI(){return ui.documents||(ui.documents={category:'',selected:'',returnFocus:'',summaryOnly:false})}
function documentRecord(id){return state.documents.find(d=>d.id===id)}
function docDate(value){return value?new Date(value+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'Belum dicatat'}
function docIcon(){return docActionIcon('file')}
function docActionIcon(name){const path={file:'<path d="M5 3h10l4 4v14H5ZM14 3v5h5M8 12h8M8 16h6"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/>',close:'<path d="m5 5 14 14M19 5 5 19"/>'};return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${path[name]}</svg>`}
function documentStatus(doc){return !doc.file?tag('Belum tersedia'):doc.source==='example'?`<span class="tag good">${icon('check')}Tersedia</span>`:tag('Metadata lokal','info')}
function overviewDocument(doc){return `<article class="activity-doc"><div class="activity-doc-title"><div class="document-symbol">${docIcon()}</div><h4>${esc(doc.title)}</h4>${documentStatus(doc)}</div>${doc.file?`<dl class="activity-doc-meta"><div><dt>Nomor</dt><dd>${esc(doc.number||'Belum dicatat')}</dd></div><div><dt>Tanggal</dt><dd>${docDate(doc.date)}</dd></div></dl><p class="activity-doc-file">${docIcon()}<span>${esc(doc.file)} · v${doc.version}</span></p><div class="actions"><button id="quick-doc-${doc.id}" onclick="openDocument('${doc.id}')">${doc.source==='example'?'Lihat':'Lihat metadata'}</button>${doc.source==='example'?`<button onclick="downloadDocumentExample('${doc.id}')">${icon('download')}Unduh contoh</button>`:''}</div>`:`<p class="activity-doc-empty">${esc(doc.title)} kegiatan belum tersedia.</p>`}</article>`}
function documentsView(){return `<div class="summary-heading"><div><h2>Dokumen Penunjang</h2><p>Pilih kategori untuk melihat daftar dokumen dan membuka preview.</p></div></div><div class="document-category-hint">${docIcon()}<span>Klik kartu untuk membuka daftar dokumen. Ketersediaan berkas ditampilkan terpisah dari hasil verifikasi.</span></div><div class="document-category-grid">${documentCategories.map((category,index)=>{const docs=state.documents.filter(d=>d.category===category.name),available=docs.filter(d=>d.file).length;return `<button class="document-category-card" id="doc-category-${index}" aria-label="Buka ${category.name}" onclick="openDocumentCategory('${category.name}')"><span class="category-card-title"><span class="category-outline-dot"></span>${category.name}${docIcon()}</span><span class="category-file-count">${available} dari ${docs.length} berkas tersedia</span><span class="category-card-description">${category.description}</span><span class="category-card-status">${tag(available===docs.length?'Berkas tersedia':available?'Sebagian tersedia':'Belum tersedia',available===docs.length?'good':'')}</span></button>`}).join('')}</div><p class="summary-caption document-category-caption">Daftar dokumen pada prototype merupakan contoh untuk diskusi. Susunan dokumen MRO final perlu dikonfirmasi bersama client.</p>`}
function openDocumentCategory(category){if(!documentCategories.some(c=>c.name===category))return;const d=docUI();if(!document.getElementById('review-document-modal').open)d.returnFocus=document.activeElement?.id||'';save();ui.tab='documents';ui.notice='';d.category=category;d.selected='';d.summaryOnly=false;render();renderDocumentPopup()}
function openDocument(id){const doc=documentRecord(id);if(!doc||!doc.file)return;const d=docUI();if(!document.getElementById('review-document-modal').open)d.returnFocus=document.activeElement?.id||'';save();d.summaryOnly=['st','ba'].includes(id);ui.tab=d.summaryOnly?'summary':'documents';ui.notice='';d.category=doc.category;d.selected=id;render();renderDocumentPopup()}
function documentFileType(doc){if(!doc.file)return '—';const ext=doc.file.split('.').pop().toLowerCase();return {pdf:'PDF',doc:'Word',docx:'Word',xls:'Excel',xlsx:'Excel',jpg:'JPG',jpeg:'JPG',png:'PNG'}[ext]||ext.toUpperCase()}
function renderDocumentPopup(){const d=docUI(),doc=d.selected?documentRecord(d.selected):null,modal=document.getElementById('review-document-modal');modal.innerHTML=`<header class="document-popup-header"><h2 id="review-document-modal-title" tabindex="-1">${esc(doc?doc.title:d.category)}</h2><button class="document-popup-close" aria-label="Tutup popup dokumen" onclick="closeDocumentPopup()">${docActionIcon('close')}</button></header><div class="document-popup-body">${doc?documentPreview(doc):categoryDocumentTable()}</div><footer class="document-popup-footer"><button class="quiet" onclick="${doc&&!d.summaryOnly?'backToDocumentCategory()':'closeDocumentPopup()'}">${doc?(d.summaryOnly?'Kembali ke Ringkasan':'Kembali ke '+esc(d.category)):'Kembali'}</button><span>${doc?'Representasi dokumen contoh':'Daftar dokumen contoh · Baca saja'}</span></footer>`;modal.innerHTML=bind(modal.innerHTML);if(!modal.open)modal.showModal();document.getElementById('review-document-modal-title').focus()}
function categoryDocumentTable(){const d=docUI(),list=state.documents.filter(doc=>doc.category===d.category);return `<div class="document-popup-table-scroll"><table class="document-popup-table"><thead><tr><th>No</th><th>Nama dokumen</th><th>Jenis file</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${list.map((doc,index)=>`<tr><td>${index+1}</td><td>${esc(doc.title)}</td><td>${documentFileType(doc)}</td><td>${documentStatus(doc)}</td><td><div class="document-popup-actions"><button aria-label="${doc.source==='metadata'?'Lihat metadata':'Lihat'} ${esc(doc.title)}" title="Lihat ${esc(doc.title)}" ${doc.file?'':'disabled'} onclick="openDocument('${doc.id}')">${docActionIcon('eye')}</button><button aria-label="Unduh contoh ${esc(doc.title)} (HTML)" title="Unduh representasi contoh (HTML)" ${doc.file&&doc.source==='example'?'':'disabled'} onclick="downloadDocumentExample('${doc.id}')">${docActionIcon('download')}</button></div></td></tr>`).join('')}</tbody></table></div><p class="document-popup-note">Tersedia menunjukkan keberadaan berkas, bukan keputusan kesesuaian. Aksi unduh pada prototype menghasilkan representasi HTML contoh.</p>`}
function documentPreview(doc){return `<div class="document-preview-meta"><span>${esc(doc.file)}</span><span>${doc.number?esc(doc.number)+' · ':''}${docDate(doc.date)} · v${doc.version}</span></div>${doc.source==='example'?`<div class="document-paper popup-document-paper"><p class="document-paper-label">Representasi dokumen untuk prototype</p><h4>${esc(doc.title)}</h4><p class="document-paper-number">${esc(doc.number||'Nomor belum dicatat')}</p><dl><div><dt>Project</dt><dd>${esc(currentProject.id)}</dd></div><div><dt>Perusahaan</dt><dd>${esc(currentProject.name)}</dd></div><div><dt>Lokasi</dt><dd>${esc(currentProject.location)}</dd></div><div><dt>Tanggal</dt><dd>${docDate(doc.date)}</dd></div></dl><p>${esc(doc.note)}</p><p class="document-paper-foot">Bukan dokumen resmi · Konten ilustratif untuk prototype.</p></div><div class="popup-document-download"><button onclick="downloadDocumentExample('${doc.id}')">${icon('download')}Unduh contoh (HTML)</button></div>`:`<div class="document-metadata-note">Metadata berkas tercatat. Isi berkas tidak disimpan pada prototype.</div><p class="document-detail-note">${esc(doc.note)}</p>`}`}
function backToDocumentCategory(){docUI().selected='';renderDocumentPopup()}
function closeDocumentPopup(){document.getElementById('review-document-modal').close()}
document.getElementById('review-document-modal').addEventListener('close',()=>{const d=docUI();d.selected='';const returnTarget=document.getElementById(d.returnFocus)||document.querySelector('[data-tab="'+ui.tab+'"]');returnTarget?.focus()});

function downloadDocumentExample(id){const doc=documentRecord(id);if(!doc?.file||doc.source!=='example')return;const html=`<!doctype html><html lang="id"><meta charset="utf-8"><title>Contoh ${esc(doc.title)}</title><style>body{font:15px/1.7 Arial,sans-serif;max-width:760px;margin:55px auto;padding:0 25px;color:#273344}h1{text-align:center;font-size:24px}small{color:#697487}dl{display:grid;grid-template-columns:150px 1fr}dd{margin:0}footer{border-top:1px solid #ddd;margin-top:50px;padding-top:15px}</style><small>Representasi prototype · Bukan dokumen resmi</small><h1>${esc(doc.title)}</h1><p style="text-align:center">${esc(doc.number)}</p><dl><dt>Project</dt><dd>${esc(currentProject.id)}</dd><dt>Perusahaan</dt><dd>${esc(currentProject.name)}</dd><dt>Lokasi</dt><dd>${esc(currentProject.location)}</dd><dt>Tanggal</dt><dd>${docDate(doc.date)}</dd><dt>Versi contoh</dt><dd>${doc.version}</dd></dl><p>${esc(doc.note)}</p><footer>Konten ilustratif untuk review UX. Bukan dokumen asli atau dokumen resmi.</footer></html>`;const blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Contoh-'+doc.id+'-MRO-v'+doc.version+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}


// Photo positions are prototype placeholders; no real client photos are bundled.
const galleryExamples=[
  {id:'hanggar',title:'Area hanggar utama',category:'Fasilitas',date:'2026-11-23',location:'Hanggar Tangerang',description:'Posisi foto untuk memperlihatkan area hanggar yang dikunjungi.'},
  {id:'workshop',title:'Area workshop komponen',category:'Fasilitas',date:'2026-11-23',location:'Workshop Tangerang',description:'Posisi foto fasilitas dan area kerja komponen MRO.'},
  {id:'visit',title:'Kegiatan verifikasi lapangan',category:'Kegiatan',date:'2026-11-23',location:'Hanggar Tangerang',description:'Posisi foto kegiatan verifikator saat pelaksanaan kunjungan.'}
];
function galleryUI(){return ui.gallery||(ui.gallery={filter:'Semua',selected:'',returnFocus:''})}
function galleryIcon(){return '<svg class="gallery-image-icon" viewBox="0 0 48 40" aria-hidden="true"><rect x="2" y="2" width="44" height="36" rx="3"/><circle cx="15" cy="13" r="4"/><path d="m4 31 11-10 9 8 8-13 14 19"/></svg>'}
function documentationView(){const filter=galleryUI().filter,items=documentationItems.filter(item=>filter==='Semua'||item.category===filter);return `<div class="summary-heading"><div><h2>Dokumentasi</h2><p>Galeri foto kegiatan dan fasilitas MRO.</p></div><span class="documentation-count">${documentationItems.length} posisi foto contoh</span></div><div class="documentation-filter" role="group" aria-label="Filter dokumentasi">${['Semua','Fasilitas','Kegiatan'].map(value=>`<button class="${filter===value?'selected':''}" aria-pressed="${filter===value}" onclick="galleryUI().filter='${value}';render()">${value}</button>`).join('')}</div><div class="documentation-grid">${items.map(item=>`<button class="documentation-card" id="gallery-${item.id}" aria-label="Lihat dokumentasi ${item.title}" onclick="openDocumentation('${item.id}')"><span class="documentation-placeholder" role="img" aria-label="Placeholder foto ${item.title}">${galleryIcon()}<span>Placeholder foto</span></span><span class="documentation-card-body"><span class="documentation-card-category">${item.category}</span><b>${item.title}</b><span>${esc(item.location)}</span><span class="documentation-date">${docDate(item.date)}</span></span></button>`).join('')||'<div class="note">Dokumentasi kegiatan belum tersedia.</div>'}</div><p class="summary-caption documentation-caption">Gambar di atas hanya penanda posisi untuk prototype. Foto kegiatan asli belum disertakan.</p>`}
function openDocumentation(id){const item=documentationItems.find(row=>row.id===id);if(!item)return;galleryUI().selected=id;galleryUI().returnFocus=document.activeElement?.id||'';const modal=document.getElementById('review-documentation-modal');modal.innerHTML=`<header class="document-popup-header"><h2 id="review-documentation-modal-title" tabindex="-1">${item.title}</h2><button class="document-popup-close" aria-label="Tutup preview dokumentasi" onclick="closeDocumentation()">${docActionIcon('close')}</button></header><div class="document-popup-body"><div class="documentation-placeholder documentation-large" role="img" aria-label="Placeholder foto ${item.title}">${galleryIcon()}<span>Placeholder foto · ${item.title}</span></div><div class="documentation-preview-details"><div><b>${esc(item.location)}</b><p>${docDate(item.date)} · ${item.category}</p></div><p>${item.description}</p><small>Representasi prototype; bukan foto kegiatan sebenarnya.</small></div></div><footer class="document-popup-footer"><button class="quiet" onclick="closeDocumentation()">Kembali ke dokumentasi</button></footer>`;modal.innerHTML=bind(modal.innerHTML);modal.showModal();document.getElementById('review-documentation-modal-title').focus()}
function closeDocumentation(){document.getElementById('review-documentation-modal').close()}
document.getElementById('review-documentation-modal').addEventListener('close',()=>{document.getElementById(galleryUI().returnFocus)?.focus()});
function firstIncomplete(){return MROReviewState.first(state)}
function canOpen(index){return MROReviewState.canOpen(state,index)}
function canEdit(index=ui.step){return MROReviewState.canEdit(state,index)}

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paths={check:'<path d="m5 12 4 4L19 6"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',upload:'<path d="M12 16V4m-5 5 5-5 5 5M4 16v5h16v-5"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/>'};
function icon(name){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`}
function tag(text,tone=''){return `<span class="tag ${tone}">${esc(text)}</span>`}
function status(index){return state.done[index]?{text:'Selesai',tone:'good'}:index===firstIncomplete()?{text:'Aktif',tone:'info'}:{text:'Terkunci',tone:''}}
function notice(text){ui.notice=text;render();toast(text)}
function save(){if(!state)return;globalThis.save();ui.save=storageOK?'Tersimpan pada browser ini':'Perubahan hanya bertahan selama halaman terbuka';updateProjectStatus()}
function updateProjectStatus(){const el=document.getElementById('review-progress-text');if(el)el.textContent=state.done.filter(Boolean).length+' dari '+stepDefinitions.length+' step selesai'}
function setTab(tab){save();ui.tab=['summary','verification','documents','documentation'].includes(tab)?tab:'summary';ui.notice='';ui.importStep=0;go('project/'+currentProject.id+'/'+ui.tab);render()}
function openStep(index){index=Number(index);if(!canOpen(index)){notice('Step '+(index+1)+' masih terkunci. Selesaikan step sebelumnya terlebih dahulu.');return}save();ui.step=index;ui.tab='verification';ui.query='';ui.notice='';ui.reopen=false;ui.importStep=0;go('project/'+currentProject.id+'/verification');render()}
function stepRail(){return `<aside class="step-rail"><h3 class="step-rail-title">Urutan verifikasi</h3><p class="step-rail-note">Step dibuka berurutan setelah step sebelumnya selesai.</p><ol class="step-list">${stepDefinitions.map((s,i)=>{const available=canOpen(i),st=status(i);return `<li class="${state.done[i]?'done':i===firstIncomplete()?'active-step':'locked'}"><button ${available?'':'disabled'} class="${i===ui.step?'selected':''}" ${i===ui.step?'aria-current="step"':''} aria-label="Step ${i+1}: ${esc(s.name)} — ${st.text}" ${available?'':`title="Selesaikan step ${i} terlebih dahulu"`} onclick="openStep(${i})"><span class="step-number">${state.done[i]?icon('check'):available?i+1:icon('lock')}</span><span><span class="step-label">${esc(s.name)}</span><span class="step-status">${st.text}</span></span></button></li>`}).join('')}</ol><p class="step-rule">Simpan draft tidak membuka step berikutnya. Gunakan <b>Selesai & Lanjut</b> setelah meninjau data.</p></aside>`}
function mobilePicker(){return `<div class="mobile-step-picker"><label for="step-choice">Urutan verifikasi</label><select id="step-choice" onchange="openStep(this.value)">${stepDefinitions.map((s,i)=>`<option value="${i}" ${i===ui.step?'selected':''} ${canOpen(i)?'':'disabled'}>${i+1}. ${esc(s.name)} — ${status(i).text}</option>`).join('')}</select></div>`}
function render(){
  updateProjectStatus();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===ui.tab));
  let content='';
  if(ui.tab==='verification')content=verificationView();
  else if(ui.tab==='documents')content=documentsView();
  else if(ui.tab==='documentation')content=documentationView();
  else content=summaryView();
  document.getElementById('project-content').innerHTML=bind(content);renderTable();
}
function stepContent(){const step=stepDefinitions[ui.step],done=state.done[ui.step],st=status(ui.step);return `<header class="step-head"><div><span class="step-kicker">Step ${ui.step+1} dari ${stepDefinitions.length}</span><h3>${esc(step.name)}</h3><p>${esc(step.description)}</p></div><div class="step-head-state">${tag(st.text,st.tone)}</div></header><div class="step-content"><div id="step-message">${ui.notice?`<div class="step-notice" role="status">${esc(ui.notice)}</div>`:''}</div>${ui.reopen?reopenConfirmation():''}${done?`<div class="step-notice">Step ini sudah selesai. Data dapat ditinjau. Gunakan <b>Buka kembali step</b> untuk melakukan perubahan.</div>`:''}${ui.importStep?importView():`${contextControls()}<div class="step-source"><span>Sumber: <strong>${esc(state.source[ui.step])}</strong></span><span>${state.rows[ui.step].length} baris data</span></div><div class="step-table-tools"><label class="search">${icon('search')}<input aria-label="Cari data verifikasi" placeholder="Cari data pada tabel…" value="${esc(ui.query)}" oninput="ui.query=this.value;renderTable()"></label><div><button onclick="downloadExcel(true)">${icon('download')}Template</button><button onclick="downloadExcel(false)">Ekspor Excel</button><button class="primary" ${canEdit()?'':'disabled'} onclick="beginImport()">${icon('upload')}Impor Excel</button></div></div><div id="verification-table"></div>`}</div>${footer()}`}

function footer(){const done=state.done[ui.step],last=ui.step===stepDefinitions.length-1;return `<footer class="step-footer"><div class="step-save"><b data-save>${esc(ui.save)}</b>${done?'Step sudah ditandai selesai.':last?'Step terakhir pada alur verifikasi.':'Step '+(ui.step+2)+' terkunci sampai step ini selesai.'}</div><div class="actions">${ui.step>0?'<button onclick="openStep(ui.step-1)">Step sebelumnya</button>':''}${done?`<button onclick="ui.reopen=true;render()">Buka kembali step</button>${!last?'<button class="primary" onclick="openStep(ui.step+1)">Step selanjutnya</button>':'<button class="primary" onclick="setTab(\'summary\')">Lihat ringkasan</button>'}`:`<button ${ui.importStep?'disabled':''} onclick="save();notice('Draft tersimpan. Step berikutnya tetap terkunci sampai Anda menekan Selesai & Lanjut.')">Simpan draft</button><button class="primary" ${ui.importStep?'disabled':''} onclick="finishStep()">${last?'Selesaikan verifikasi':'Selesai & Lanjut'} ${icon('arrow')}</button>`}</div></footer>`}

function importView(){const def=stepDefinitions[ui.step],candidates=candidateRows();return `<section class="step-import"><h4>Impor data Excel</h4><p>Data akan diterapkan pada step ${ui.step+1}: ${esc(def.name)}.</p><ol class="flow-steps"><li class="${ui.importStep===1?'active':''}">1. Pilih berkas</li><li class="${ui.importStep===2?'active':''}">2. Preview & validasi</li><li class="${ui.importStep===3?'active':''}">3. Hasil impor</li></ol>${ui.importStep===1?`<div class="import-upload"><label for="excel-file">Berkas Excel</label><input id="excel-file" type="file" accept=".xlsx,.xls" onchange="selectExcel(this.files[0])"><p>${ui.importName?'Berkas dipilih: '+esc(ui.importName):'Pilih berkas atau gunakan contoh untuk mencoba alur.'}</p><button onclick="ui.importName='Contoh-Step-'+(ui.step+1)+'.xlsx';render()">Gunakan contoh Excel</button></div><div class="flow-mode"><label>Perlakuan terhadap data sebelumnya</label><label class="radio"><input type="radio" name="mode" ${ui.mode==='append'?'checked':''} onchange="ui.mode='append'">Tambah data</label><label class="radio"><input type="radio" name="mode" ${ui.mode==='replace'?'checked':''} onchange="ui.mode='replace'">Ganti data pada step ini</label></div><p class="import-origin">Prototype tidak membaca isi Excel. Preview memakai data contoh untuk menggambarkan alur impor.</p>${ui.importError?`<p class="inline-error">${esc(ui.importError)}</p>`:''}<div class="flow-actions"><button onclick="ui.importStep=0;render()">Batalkan impor</button><button class="primary" ${ui.importName?'':'disabled'} onclick="ui.importStep=2;render()">Preview & validasi</button></div>`:ui.importStep===2?`<p class="step-subtitle">${esc(ui.importName)} · Preview data contoh</p><div class="flow-meta"><div><b>2</b><small>Baris valid</small></div><div><b>1</b><small>Baris gagal validasi</small></div></div><div class="flow-preview"><table class="step-table"><thead><tr><th>Baris</th>${def.columns.map(c=>`<th>${esc(c)}</th>`).join('')}<th>Validasi</th></tr></thead><tbody>${candidates.map((row,i)=>`<tr><td>${i+2}</td>${row.map(v=>`<td>${esc(v)}</td>`).join('')}<td>${tag('Valid','good')}</td></tr>`).join('')}<tr><td>4</td><td colspan="${def.columns.length}">Contoh baris dengan kolom wajib kosong</td><td>${tag('Perlu diperbaiki','danger')}</td></tr></tbody></table></div><div class="flow-warning">${ui.mode==='replace'?state.rows[ui.step].length+' data sebelumnya akan diganti oleh 2 baris valid contoh.':'2 baris valid contoh akan ditambahkan.'} Baris gagal tidak diterapkan. Impor tidak menyelesaikan step verifikasi.</div><div class="flow-actions"><button onclick="ui.importStep=1;render()">Kembali</button><button class="primary" onclick="applyImport()">Terapkan 2 baris valid</button></div>`:`<div class="flow-complete"><h3>2 data contoh berhasil diterapkan</h3><p>1 baris gagal tidak diterapkan. Data tersedia untuk diverifikasi pada tabel. Step ini tetap aktif dan step berikutnya tetap terkunci.</p><button class="primary" style="margin-top:16px" onclick="ui.importStep=0;render()">Kembali ke tabel verifikasi</button></div>`}</section>`}
function applyImport(){if(!canEdit()||ui.importApplied||ui.importStep!==2)return;MROReviewState.applyImport(state,ui.step,candidateRows(),ui.importName,ui.mode);ui.importStep=3;ui.importApplied=true;log(currentProject.id,'Impor simulasi step '+(ui.step+1)+': '+ui.importName+'; 2 baris contoh diterapkan, tidak membaca isi berkas.');save();render()}
