</style></head><body><div id="app"></div><button class="feedbackfloat" id="feedback-button" onclick="openFeedback()">☷ &nbsp; Beri feedback</button><dialog id="modal"></dialog><dialog id="inspection-modal" class="inspection-modal" aria-labelledby="inspection-modal-title"></dialog><div id="live" role="status" aria-live="polite"></div>
<script>
'use strict';

// Local demo data. Each examination group owns its table and document metadata.
const inspectionDefinitions = [
  {description:'Identitas badan usaha, perizinan, dan lokasi fasilitas.', columns:['Informasi','Data perusahaan','Dokumen pendukung'], rows:[['Nama perusahaan','{company}','Profil perusahaan.pdf'],['NIB','SIM-NIB-2026-001','NIB simulasi.pdf'],['Lokasi fasilitas','{location}','Profil fasilitas.pdf']]},
  {description:'Dokumen persyaratan dan referensi perusahaan MRO.', columns:['Dokumen','Referensi simulasi','Ketersediaan'], rows:[['Perizinan usaha','SIM-IZIN-2026-001','Contoh tersedia'],['Sertifikat kompetensi','SIM-SERT-2026-002','Contoh tersedia'],['Surat Penetapan','SIM-SP-2026-003','Perlu dikonfirmasi']]},
  {description:'Daftar barang, part number, jumlah, dan bukti kebutuhan impor.', columns:['Referensi HS simulasi','Nama barang','Part number','Jumlah rencana','Satuan','Dokumen pendukung'], rows:[['SIM-HS-001','Hydraulic pump','HP-204','40','unit','Lembar spesifikasi HP-204 · v2'],['SIM-HS-002','Seal kit','SK-017','100','set','Rencana kebutuhan impor · v1'],['SIM-HS-003','Bearing assembly','BA-320','25','unit','Katalog komponen BA-320 · v1']]},
  {description:'Lingkup kegiatan MRO, periode, dan fasilitas pelaksana.', columns:['Kegiatan MRO','Objek pemeriksaan','Periode rencana','Fasilitas'], rows:[['Pemeliharaan komponen','Hydraulic pump','Nov–Des 2026','{location}'],['Perbaikan komponen','Bearing assembly','Nov–Des 2026','Workshop komponen']]},
  {description:'Fasilitas, satuan kapasitas, dan bukti pendukung kegiatan.', columns:['Fasilitas','Kapasitas simulasi','Satuan kapasitas','Dokumen pendukung'], rows:[['Hanggar utama','2','pesawat per periode layanan','Profil fasilitas.pdf'],['Workshop komponen','60','komponen per bulan','Daftar peralatan.pdf']]},
  {description:'Lingkup pekerjaan dan dokumen subkontrak jika digunakan.', columns:['Mitra subkontrak','Lingkup pekerjaan','Referensi dokumen','Catatan'], rows:[]},
  {description:'Catatan kunjungan, kondisi fasilitas, dan bukti lapangan.', columns:['Objek pemeriksaan','Kondisi / hasil observasi','Dokumen pendukung','Catatan'], rows:[]}
];
let inspectionContext = null;

function inspectionRows(p,index){
  const saved=db.inspectionRows?.[p.id+'|'+index];
  return saved || inspectionDefinitions[index].rows.map(row=>row.map(value=>value.replace('{company}',p.name).replace('{location}',p.location)));
}
function inspectionState(p,index){
  const value=db.checks[p.id+'|'+groups[index]]?.value;
  if(value) return {label:value,tone:value==='Sesuai'||value==='Tidak relevan'?'green':value==='Perlu klarifikasi'||value==='Tidak sesuai'?'amber':'cyan',done:value==='Sesuai'||value==='Tidak relevan'};
  if(p.fresh) return {label:'Belum dinilai',tone:'cyan',done:false};
  return index<2?{label:'Selesai diperiksa',tone:'green',done:true}:index===2?{label:'Perlu klarifikasi',tone:'amber',done:false}:{label:'Belum dinilai',tone:'cyan',done:false};
}
function inspectionTimeline(p){
  const completed=groups.filter((_,i)=>inspectionState(p,i).done).length;
  return `<section class="panel inspection-timeline-panel" aria-labelledby="inspection-timeline-title"><div class="inspection-timeline-head"><div><h3 id="inspection-timeline-title">Kelompok pemeriksaan</h3><p class="muted small">Buka setiap kelompok untuk meninjau data dan dokumen pendukung.</p></div><span class="badge gray">${completed} dari ${groups.length} kelompok ditinjau</span></div><ol class="inspection-timeline">${groups.map((name,index)=>{
    const state=inspectionState(p,index),rows=inspectionRows(p,index),files=(db.attachments||[]).filter(a=>a.project===p.id&&a.group===index);
    return `<li class="inspection-timeline-item ${state.tone}"><div class="inspection-timeline-top"><h4>${esc(name)}</h4><div class="inspection-timeline-actions">${badge(state.label,state.tone==='cyan'?'gray':state.tone)}<button type="button" class="inspection-open" aria-label="Buka ${esc(name)}" onclick="openInspectionGroup('${p.id}',${index})">Buka ${inspectionIcon('open')}</button></div></div><p>${inspectionDefinitions[index].description}</p><div class="inspection-timeline-meta"><button type="button" class="inspection-file-chip" onclick="openInspectionGroup('${p.id}',${index})">${inspectionIcon('file')}${rows.length?rows.length+' '+(index===1?'dokumen':'data pemeriksaan'):'Belum ada data'}</button>${files.length?`<span class="small muted">${files.length} lampiran lokal</span>`:''}<span class="inspection-step-label">Kelompok ${index+1}</span></div></li>`;
  }).join('')}</ol></section>`;
}
function inspectionIcon(name){const paths={open:'<path d="M14 3h7v7M21 3l-11 11M10 3H3v18h18v-7"/>',file:'<path d="M5 3h10l4 4v14H5ZM14 3v5h5M8 12h8M8 16h6"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',upload:'<path d="M12 16V4m-5 5 5-5 5 5M4 16v5h16v-5"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',plus:'<path d="M12 4v16M4 12h16"/>',close:'<path d="m5 5 14 14M19 5 5 19"/>'};return `<svg class="inspection-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${paths[name]}</svg>`}
function openInspectionGroup(id,index){
  inspectionContext={id,index,query:'',page:1,size:10};
  refreshInspectionGroup();
  document.getElementById('inspection-modal').showModal();
}
function closeInspectionGroup(){document.getElementById('inspection-modal').close();inspectionContext=null}
function refreshInspectionGroup(){
  if(!inspectionContext)return;
  const p=db.projects.find(p=>p.id===inspectionContext.id),index=inspectionContext.index;
  document.getElementById('inspection-modal').innerHTML=`<header class="inspection-modal-head"><div><h2 id="inspection-modal-title">${esc(groups[index])}</h2><p>${esc(p.name)} <span>·</span> ${esc(p.id)} <span>·</span> W1</p></div><button type="button" class="inspection-close" aria-label="Tutup kelompok pemeriksaan" onclick="closeInspectionGroup()">${inspectionIcon('close')}</button></header><div class="inspection-modal-body"><p class="inspection-description">${inspectionDefinitions[index].description}</p><div class="inspection-toolbar"><label class="inspection-search">${inspectionIcon('search')}<input type="search" aria-label="Cari data pemeriksaan" placeholder="Cari" value="${esc(inspectionContext.query)}" oninput="filterInspectionTable(this.value)"></label><button type="button" onclick="exportInspectionTable(true)">${inspectionIcon('download')}Unduh Template</button><button type="button" onclick="exportInspectionTable(false)">${inspectionIcon('file')}Ekspor Excel</button><button type="button" class="inspection-upload" onclick="importInspectionExcel()">${inspectionIcon('upload')}Unggah Excel</button></div><div id="inspection-table-area">${inspectionTable()}</div><div class="inspection-support"><div class="inspection-support-head"><div><h3>Dokumen pendukung</h3><p>Hubungkan lampiran dengan kelompok pemeriksaan ini.</p></div><button type="button" onclick="attachInspectionDocument()">${inspectionIcon('plus')}Lampirkan Dokumen</button></div><div class="inspection-attachment-list">${inspectionAttachments()}</div></div><div class="inspection-modal-bottom"><div>${assessment(p,groups[index])}</div><div class="inspection-disclaimer">Prototype · Unggah mencatat nama berkas untuk simulasi alur impor. Isi Excel belum diproses.</div></div></div><footer class="inspection-modal-footer"><button type="button" class="textbutton" onclick="closeInspectionGroup()">Kembali</button><button type="button" onclick="newFinding('${p.id}','${groups[index]}')">Catat temuan</button></footer>`;
}
function inspectionTable(){
  const {id,index,query,size}=inspectionContext,p=db.projects.find(p=>p.id===id),definition=inspectionDefinitions[index];
  const filtered=inspectionRows(p,index).map((row,i)=>({row,i})).filter(({row})=>row.some(v=>String(v).toLowerCase().includes(query.toLowerCase())));
  const pages=Math.max(1,Math.ceil(filtered.length/size));inspectionContext.page=Math.min(inspectionContext.page,pages);
  const page=inspectionContext.page,start=(page-1)*size,visible=filtered.slice(start,start+size);
  const headers=index===2?`<tr><th rowspan="2" class="inspection-number">No</th><th rowspan="2">Referensi HS simulasi</th><th colspan="2">Identitas barang sesuai rencana</th><th colspan="2">Kebutuhan impor</th><th rowspan="2">Dokumen pendukung</th><th rowspan="2">Tindakan</th></tr><tr><th>Nama barang</th><th>Part number</th><th>Jumlah rencana</th><th>Satuan</th></tr>`:`<tr><th class="inspection-number">No</th>${definition.columns.map(c=>`<th>${esc(c)}</th>`).join('')}<th>Tindakan</th></tr>`;
  return `<div class="inspection-table-scroll"><table class="inspection-data-table ${index===2?'inspection-import-table':''}"><thead>${headers}</thead><tbody>${visible.map(({row,i},n)=>`<tr><td>${start+n+1}</td>${row.map(v=>`<td>${esc(v)}</td>`).join('')}<td><button type="button" class="textbutton" onclick="previewInspectionRow(${i})">Periksa</button></td></tr>`).join('')||`<tr><td colspan="${definition.columns.length+2}" class="empty">${query?'Tidak ada data yang cocok. Ubah pencarian.':'Belum ada data. Tambahkan data atau coba simulasi unggah Excel.'}</td></tr>`}</tbody><tfoot><tr><td colspan="${definition.columns.length+2}">${index===2?'Jumlah dipisahkan menurut satuan: '+inspectionQuantitySummary(filtered.map(v=>v.row)):'Total '+filtered.length+' data pemeriksaan'}</td></tr></tfoot></table></div><div class="inspection-pagination"><button type="button" class="inspection-add" onclick="addInspectionRow()" aria-label="Tambah data pemeriksaan">${inspectionIcon('plus')}</button><span>Menampilkan ${filtered.length?start+1:0}–${Math.min(start+size,filtered.length)} dari ${filtered.length} data</span><label><span class="sr-only">Jumlah data per halaman</span><select aria-label="Jumlah data per halaman" onchange="inspectionContext.size=Number(this.value);inspectionContext.page=1;refreshInspectionTable()">${[5,10,25].map(n=>`<option value="${n}" ${size===n?'selected':''}>${n}/halaman</option>`).join('')}</select></label><div class="inspection-page-buttons"><button type="button" aria-label="Halaman sebelumnya" ${page===1?'disabled':''} onclick="inspectionContext.page--;refreshInspectionTable()">‹</button><span>${page}</span><button type="button" aria-label="Halaman berikutnya" ${page===pages?'disabled':''} onclick="inspectionContext.page++;refreshInspectionTable()">›</button></div></div>`;
}
function inspectionQuantitySummary(rows){const totals={};rows.forEach(row=>{const amount=Number(row[3]);if(Number.isFinite(amount))totals[row[4]]=(totals[row[4]]||0)+amount});return Object.entries(totals).map(([unit,n])=>esc(n+' '+unit)).join(' · ')||'0'}
function filterInspectionTable(query){inspectionContext.query=query;inspectionContext.page=1;refreshInspectionTable()}
function refreshInspectionTable(){document.getElementById('inspection-table-area').innerHTML=inspectionTable()}
function inspectionAttachments(){const {id,index}=inspectionContext;const files=(db.attachments||[]).map((file,position)=>({file,position})).filter(({file})=>file.project===id&&file.group===index);return files.length?files.map(({file:a,position})=>`<div class="inspection-attachment">${inspectionIcon('file')}<div><b>${esc(a.name)}</b><small>${esc(a.note)} · Metadata lokal</small></div>${badge(a.kind==='excel'?'Simulasi impor':'Lampiran','gray')}<button type="button" class="textbutton" aria-label="Hapus metadata ${esc(a.name)}" onclick="removeInspectionAttachment(${position})">Hapus</button></div>`).join(''):'<p class="inspection-no-attachments">Belum ada lampiran pada kelompok ini.</p>'}
function removeInspectionAttachment(position){const file=db.attachments[position];dialog('Hapus metadata lampiran?',`<p class="note">${esc(file.name)}<br>Hanya catatan pada browser ini yang dihapus. Berkas asli tetap berada di komputer Anda.</p><div class="footeractions">${btn('Batal','closeModal()')}${btn('Hapus metadata',`confirmRemoveInspectionAttachment(${position})`)}</div>`)}
function confirmRemoveInspectionAttachment(position){const {id}=inspectionContext;db.attachments.splice(position,1);log(id,'Metadata lampiran kelompok pemeriksaan dihapus.');closeModal();render();refreshInspectionGroup()}
function importInspectionExcel(){dialog('Unggah Excel · '+groups[inspectionContext.index],`<form onsubmit="saveInspectionAttachment(event,'excel')"><p class="note">Pilih berkas Excel untuk mencoba alur impor. Prototype hanya mencatat nama berkas; data tabel tidak berubah dan isi berkas tidak dibaca.</p><label for="inspection-file">Berkas Excel</label><input id="inspection-file" type="file" accept=".xlsx,.xls" required><label for="inspection-file-note">Catatan impor (opsional)</label><input id="inspection-file-note" placeholder="Contoh: rencana kebutuhan impor revisi 2"><p class="error" id="inspection-file-error" role="alert"></p><div class="footeractions">${btn('Batal','closeModal()')}<button class="primary">Catat simulasi impor</button></div></form>`)}
function attachInspectionDocument(){dialog('Lampirkan Dokumen',`<form onsubmit="saveInspectionAttachment(event,'document')"><p class="note">Lampiran dikaitkan ke ${esc(groups[inspectionContext.index])}. Hanya nama berkas dan catatan disimpan lokal.</p><label for="inspection-file">Dokumen pendukung</label><input id="inspection-file" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" required><label for="inspection-file-note">Konteks dokumen</label><input id="inspection-file-note" required placeholder="Contoh: spesifikasi Hydraulic pump"><p class="error" id="inspection-file-error" role="alert"></p><div class="footeractions">${btn('Batal','closeModal()')}<button class="primary">Simpan lampiran simulasi</button></div></form>`)}
function saveInspectionAttachment(event,kind){
  event.preventDefault();if(!inspectionContext)return;
  const file=document.getElementById('inspection-file').files[0];
  if(!file)return;
  if(!(kind==='excel'?/\.(xlsx|xls)$/i:/\.(pdf|docx?|jpe?g|png)$/i).test(file.name)){document.getElementById('inspection-file-error').textContent=kind==='excel'?'Pilih berkas .xlsx atau .xls.':'Pilih PDF, Word, JPG, atau PNG.';return}
  const {id,index}=inspectionContext;
  db.attachments=db.attachments||[];db.attachments.push({project:id,group:index,kind,name:file.name,note:document.getElementById('inspection-file-note').value||'Simulasi impor Excel; isi belum diproses'});
  log(id,(kind==='excel'?'Simulasi impor Excel':'Lampiran dokumen')+' pada '+groups[index]+': '+file.name+' (metadata saja).');
  closeModal();render();refreshInspectionGroup();toast('Metadata berkas disimpan pada kelompok pemeriksaan.');
}
function addInspectionRow(){const definition=inspectionDefinitions[inspectionContext.index];dialog('Tambah data · '+groups[inspectionContext.index],`<form onsubmit="saveInspectionRow(event)"><p class="small muted">Data contoh tersimpan di browser ini.</p><div class="formgrid">${definition.columns.map((column,i)=>`<div><label for="inspection-field-${i}">${esc(column)}</label><input id="inspection-field-${i}" required ${inspectionContext.index===2&&i===3?'type="number" min="0" step="any"':''}></div>`).join('')}</div><div class="footeractions">${btn('Batal','closeModal()')}<button class="primary">Simpan data simulasi</button></div></form>`)}
function saveInspectionRow(event){event.preventDefault();const {id,index}=inspectionContext,p=db.projects.find(p=>p.id===id),rows=inspectionRows(p,index).map(row=>[...row]);rows.push(inspectionDefinitions[index].columns.map((_,i)=>document.getElementById('inspection-field-'+i).value));db.inspectionRows=db.inspectionRows||{};db.inspectionRows[id+'|'+index]=rows;log(id,'Data simulasi ditambahkan pada '+groups[index]);closeModal();render();refreshInspectionGroup();toast('Data pemeriksaan simulasi disimpan.')}
function previewInspectionRow(rowIndex){
  const {id,index}=inspectionContext,p=db.projects.find(p=>p.id===id),row=inspectionRows(p,index)[rowIndex];
  const details=inspectionDefinitions[index].columns.map((name,i)=>`<div><small>${esc(name)}</small>${esc(row[i])}</div>`).join('');
  const evidence=index===2?row[5]:groups[index];
  const evidenceAction=esc('previewEvidence('+JSON.stringify(evidence)+','+JSON.stringify(id)+')');
  const findingAction=esc('newFinding('+JSON.stringify(id)+','+JSON.stringify(index===2?row[1]+' · '+row[2]:groups[index])+')');
  dialog(index===2?'Pemeriksaan barang':'Detail data pemeriksaan',`<div class="keyvalues" style="padding-top:22px">${details}</div>${index===2?'<p class="note">Tinjau spesifikasi dan bukti pendukung. Referensi HS pada demo bukan klasifikasi tarif yang sah.</p>'+assessment(p,'item-'+rowIndex):''}<div class="footeractions"><button type="button" onclick="${evidenceAction}">Lihat bukti</button><button type="button" onclick="${findingAction}">Catat temuan</button>${btn('Kembali ke tabel','closeModal()')}</div>`);
}

// Genuine, dependency-free XLSX export (uncompressed ZIP / Office Open XML).
function inspectionWorkbook(columns,rows){
  const xml=v=>String(v).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));
  const columnName=index=>{let result='';for(index++;index;index=Math.floor((index-1)/26))result=String.fromCharCode(65+(index-1)%26)+result;return result};
  const sheet=[columns,...rows].map((row,r)=>`<row r="${r+1}">${row.map((v,c)=>`<c r="${columnName(c)}${r+1}" t="inlineStr"><is><t xml:space="preserve">${xml(v)}</t></is></c>`).join('')}</row>`).join('');
  const files={
    '[Content_Types].xml':'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>',
    '_rels/.rels':'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
    'xl/workbook.xml':'<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Pemeriksaan MRO" sheetId="1" r:id="rId1"/></sheets></workbook>',
    'xl/_rels/workbook.xml.rels':'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>',
    'xl/worksheets/sheet1.xml':`<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${sheet}</sheetData></worksheet>`
  };
  const encoder=new TextEncoder(),chunks=[],directory=[];let offset=0;
  const crc=bytes=>{let n=0xffffffff;for(const b of bytes){n^=b;for(let bit=0;bit<8;bit++)n=n&1?(n>>>1)^0xedb88320:n>>>1}return (n^0xffffffff)>>>0};
  const header=(length,fields)=>{let a=new Uint8Array(length),v=new DataView(a.buffer);for(const [at,bytes,value]of fields)bytes===4?v.setUint32(at,value,true):v.setUint16(at,value,true);return a};
  for(const [name,content]of Object.entries(files)){const filename=encoder.encode(name),data=encoder.encode(content),checksum=crc(data);const local=header(30,[[0,4,0x04034b50],[4,2,20],[6,2,0x800],[12,2,33],[14,4,checksum],[18,4,data.length],[22,4,data.length],[26,2,filename.length]]);chunks.push(local,filename,data);directory.push(header(46,[[0,4,0x02014b50],[4,2,20],[6,2,20],[8,2,0x800],[14,2,33],[16,4,checksum],[20,4,data.length],[24,4,data.length],[28,2,filename.length],[42,4,offset]]),filename);offset+=30+filename.length+data.length}
  const directorySize=directory.reduce((sum,a)=>sum+a.length,0);return new Blob([...chunks,...directory,header(22,[[0,4,0x06054b50],[8,2,5],[10,2,5],[12,4,directorySize],[16,4,offset]])],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

/section></div>`}

:'Kapasitas pendukung kenaikan jumlah belum tersedia',item:'Matriks perubahan jumlah',note:'Tambahkan referensi kapasitas fasilitas untuk mendukung perubahan 40 menjadi 60 unit.',status:'Terbuka'},{id:3,project:'MRO-DEMO-003',title:'Selisih 2 unit perlu ditelusuri',item:'Seal kit · PN SK-017',note:'Rekonsiliasi 100 unit impor, 70 digunakan dan 28 persediaan menyisakan selisih 2 unit. Selisih bukan kesimpulan pelanggaran.',status:'Terbuka'},{id:4,project:'MRO-DEMO-004',title:'Bukti kondisi barang perlu dilengkapi',item:'Bearing assembly · PN BA-320',note:'Foto label dan referensi dokumen pabean belum terhubung.',status:'Terbuka'}],checks:{},drafts:{},categories:{},activity:[]};
let storageOK=true;function getStored(key,fallback){try{const val=localStorage.getItem(key);return val?JSON.parse(val):fallback}catch(e){storageOK=false;return fallback}}let db=getStored('mro-siviki-demo-v1',structuredClone(seed));let feedback=getStored('mro-siviki-feedback-v1',[]);let role=getStored('mro-siviki-role-v1','Verifikator');let view='mine',scheduleView='calendar',selectedItem=0,group='Rencana kebutuhan impor',wizardStep=1,wizard={},route=[];

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function date(s){return new Date(s+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}function btn(t,fn,cls=''){return `<button type="button" class="${cls}" onclick="${fn}">${t}</button>`}function badge(t,cls=''){return `<span class="badge ${cls}">${esc(t)}</span>`}function project(){return db.projects.find(p=>p.id===route[1])||db.projects[0]}function go(path){location.hash=path}function log(p,t){db.activity.unshift({project:p,time:new Date().toLocaleString('id-ID',{timeZone:'Asia/Jakarta'}),text:t});save()}function toast(t){document.getElementById('live').innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>document.getElementById('live').innerHTML='',4500)}

function navlink(path,label){return `<a class="${(location.hash.slice(1)||'home')===path?'active':''}" href="#${path}">${label}</a>`}function side(){return `<aside class="sidebar" id="sidebar"><div class="brand"><i class="brandmark"></i><div>MRO<small>Aviation verification platform</small></div><button class="close-nav" aria-label="Tutup navigasi" onclick="toggleNav()">×</button></div><nav>${navlink('home',icon('grid')+'Beranda')}<details open><summary>${icon("folder")}Project</summary>${navlink('schedule',icon('calendar')+'Jadwal dan Penugasan')}${Object.entries(types).map(([w,t])=>navlink('list/'+w,`${icon('check')}${t} <span style="margin-left:auto;font-size:12px">${w}</span>`)).join('')}</details><details ${route[0]==='master'?'open':''}><summary>${icon("database")}Master</summary>${['Perusahaan MRO','Fasilitas & Lokasi','Referensi Barang & HS Code','Jenis Verifikasi','Kategori Dokumen'].map((n,i)=>navlink('master/'+i,n)).join('')}</details><details ${route[0]==='documents'?'open':''}><summary>${icon("file")}Dokumen & Laporan</summary>${['SKVI & Perubahan','Pemeriksaan Realisasi','SKVBS','Laporan Operasional'].map((n,i)=>navlink('documents/'+i,n)).join('')}</details><details ${route[0]==='admin'?'open':''}><summary>${icon("users")}Administrasi</summary>${['Pengguna','Role & Hak Akses','Audit Aktivitas','Pengaturan Sistem'].map((n,i)=>navlink('admin/'+i,n)).join('')}</details></nav></aside>`}
function head(title,desc,actions=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}function shell(content){return `<div class="shell">${side()}<div><header class="topbar"><div class="toplinks"><button class="mobilemenu" aria-label="Buka navigasi" onclick="toggleNav()">☰</button><span class="reviewlabel small muted">${esc(({home:"Beranda",schedule:"Project",list:"Project",project:"Project",register:"Registrasi Project",master:"Master",documents:"Dokumen & Laporan",admin:"Administrasi",feedback:"Feedback client",guide:"Panduan"})[route[0]]||"MRO")} <span style="color:#b6cbd5">/</span> <b style="color:var(--navy)">MRO</b></span></div><div class="toplinks"><a href="#public" class="small">Website publik</a><button class="top-icon" aria-label="Ganti tema" onclick="toggleTheme()">${icon("moon")}</button><button class="top-icon" aria-label="Lihat temuan terbuka" onclick="go('project/MRO-DEMO-001/findings')">${icon("bell")}</button><span class="top-divider"></span><select aria-label="Simulasi peran" onchange="setRole(this.value)">${roles.map(r=>`<option ${r===role?'selected':''}>${r}</option>`).join('')}</select><span class="avatar" title="Akun simulasi">DP</span><div class="user-meta"><b>Dimas Pratama</b><br><small>Akun demonstrasi</small></div></div></header><main class="main" id="main">${!storageOK?'<div class="note warning">Penyimpanan browser tidak tersedia. Ekspor feedback sebelum menutup halaman.</div>':''}${content}</main></div></div>`}function setRole(v){role=v;try{localStorage.setItem('mro-siviki-role-v1',JSON.stringify(v))}catch{}toast('Simulasi tampilan peran: '+v+'. Hak akses belum diterapkan; menunggu SOP.');render()}

ll></div>`).join('')}</section><section class="panel"><h3>Yang perlu divalidasi</h3><p class="small muted">Apakah menu, urutan pemeriksaan, dan tindakan berikutnya sudah mendukung pekerjaan tim?</p><a class="small" href="#guide">Buka skenario review</a></section></aside></div>`}
